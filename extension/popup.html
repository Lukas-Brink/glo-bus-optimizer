<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>GloBus-Pilot</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap');

    :root {
      --sl-glass: rgba(240, 243, 248, 0.75);
      --sl-card: rgba(15, 23, 42, 0.055);
      --sl-border: rgba(15, 23, 42, 0.12);
      --sl-btn-primary-bg: rgba(15, 23, 42, 0.12);
      --sl-btn-primary-border: rgba(15, 23, 42, 0.22);
      --sl-btn-primary-text: #0b0f19;
      --sl-btn-primary-hover: rgba(15, 23, 42, 0.20);
      --sl-btn-primary-hover-border: rgba(15, 23, 42, 0.35);
      --sl-btn-primary-active: rgba(15, 23, 42, 0.28);
      --sl-text: #0b0f19;
      --sl-muted: #475569;
      --sl-dim: #64748b;
      --sl-brand-blue: #0e76ff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 280px;
      font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--sl-glass);
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      color: var(--sl-text);
      padding: 16px;
      border: 1px solid var(--sl-border);
      border-radius: 0px;
      box-shadow: 0 16px 36px rgba(15, 23, 42, 0.12);
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--sl-border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .beacon {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--sl-brand-blue);
    }

    h3 {
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--sl-text);
    }

    .info-card {
      background: var(--sl-card);
      backdrop-filter: blur(16px);
      border: 1px solid var(--sl-border);
      border-radius: 0px;
      padding: 10px 12px;
      margin-bottom: 14px;
    }

    .info-eyebrow {
      font-family: 'JetBrains Mono', monospace;
      font-size: 8.5px;
      font-weight: 600;
      color: var(--sl-dim);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    p {
      font-size: 11px;
      color: var(--sl-muted);
      line-height: 1.45;
    }

    .btn-main {
      width: 100%;
      height: 38px;
      background: var(--sl-btn-primary-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--sl-btn-primary-border);
      color: var(--sl-btn-primary-text);
      border-radius: 0px;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 11.5px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.05);
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-main:hover {
      background: var(--sl-btn-primary-hover);
      border-color: var(--sl-btn-primary-hover-border);
      color: #000000;
      box-shadow: 0 3px 10px rgba(15, 23, 42, 0.10);
    }

    .btn-main:active {
      background: var(--sl-btn-primary-active);
    }

    .arrow {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      font-weight: 700;
      transition: transform 0.15s ease;
    }

    .btn-main:hover .arrow {
      transform: translateX(3px);
    }

    .subtext {
      display: block;
      margin-top: 10px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 8.5px;
      letter-spacing: 0.06em;
      color: var(--sl-dim);
      text-align: center;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <span class="beacon"></span>
      <h3>GLOBUS PILOT</h3>
    </div>
  </div>

  <div class="info-card">
    <div class="info-eyebrow">SYSTEM READY</div>
    <p>Autonomous decision optimizer for GLO-BUS. Navigate to any decision page and summon the floating HUD.</p>
  </div>

  <button class="btn-main" id="reopen-hud">
    <span>OPEN CONTROLLER HUD</span>
    <span class="arrow">→</span>
  </button>
  <span class="subtext">COMPATIBLE WITH GLO-BUS.COM</span>

  <script src="popup.js"></script>
</body>
</html>
